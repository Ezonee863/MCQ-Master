<script>
/* ---------- STATE ---------- */
let currentTab = 'home';
let user = JSON.parse(localStorage.getItem('mcq_user') || 'null');
let subjectsData = [];
let groupsData = [];
let presetsData = [];
let quiz = { questions: [], index: 0, score: 0, answers: {}, startTime: null, timer: null };
let archiveSubTab = 'subject';
let examSubTab = 'mock';

/* ---------- COLOR MAPS ---------- */
const SUBJECT_GRADIENTS = {
  'বাংলা': 'from-amber-400 to-yellow-500',
  'english': 'from-red-500 to-rose-600',
  'পদার্থবিজ্ঞান': 'from-blue-600 to-indigo-700',
  'physics': 'from-blue-600 to-indigo-700',
  'রসায়ন': 'from-violet-500 to-purple-600',
  'chemistry': 'from-violet-500 to-purple-600',
  'জীববিজ্ঞান': 'from-emerald-400 to-green-500',
  'biology': 'from-emerald-400 to-green-500',
  'উচ্চতর গণিত': 'from-teal-400 to-emerald-500',
  'higher math': 'from-teal-400 to-emerald-500',
  'গণিত': 'from-teal-400 to-emerald-500',
  'math': 'from-teal-400 to-emerald-500',
  'তথ্য ও যোগাযোগ প্রযুক্তি': 'from-sky-400 to-blue-500',
  'ict': 'from-sky-400 to-blue-500',
  'সাধারণ জ্ঞান': 'from-cyan-500 to-blue-600',
  'gk': 'from-cyan-500 to-blue-600',
  'পরিসংখ্যান': 'from-pink-400 to-rose-500',
  'statistics': 'from-pink-400 to-rose-500',
  'অর্থনীতি': 'from-orange-400 to-amber-500',
  'economics': 'from-orange-400 to-amber-500'
};

const SUBJECT_ICONS = {
  'বাংলা': 'fa-font',
  'english': 'fa-language',
  'পদার্থবিজ্ঞান': 'fa-atom',
  'physics': 'fa-atom',
  'রসায়ন': 'fa-flask',
  'chemistry': 'fa-flask',
  'জীববিজ্ঞান': 'fa-dna',
  'biology': 'fa-dna',
  'উচ্চতর গণিত': 'fa-square-root-variable',
  'higher math': 'fa-square-root-variable',
  'গণিত': 'fa-calculator',
  'math': 'fa-calculator',
  'তথ্য ও যোগাযোগ প্রযুক্তি': 'fa-laptop-code',
  'ict': 'fa-laptop-code',
  'সাধারণ জ্ঞান': 'fa-globe',
  'gk': 'fa-globe',
  'পরিসংখ্যান': 'fa-chart-bar',
  'statistics': 'fa-chart-bar'
};

const GROUP_GRADIENTS = {
  'du': 'from-blue-700 to-blue-900',
  'ru': 'from-blue-600 to-indigo-800',
  'nu': 'from-violet-600 to-purple-800',
  'ku': 'from-emerald-600 to-green-800',
  'gst': 'from-amber-500 to-orange-600',
  'buet': 'from-red-700 to-red-900',
  'cuet': 'from-cyan-600 to-blue-700',
  'ruet': 'from-teal-600 to-emerald-700',
  'sust': 'from-indigo-600 to-violet-700',
  'ju': 'from-sky-600 to-cyan-700',
  'cu': 'from-rose-600 to-pink-700'
};

const GROUP_NAMES = {
  'du': 'ঢাবি', 'ru': 'রাবি', 'nu': 'নু', 'ku': 'কু',
  'gst': 'জিএসটি', 'buet': 'বুয়েট', 'cuet': 'চুয়েট',
  'ruet': 'রুয়েট', 'sust': 'শাবিপ্রবি', 'ju': 'জাবি', 'cu': 'চবি'
};

function getSubjectGradient(name) {
  const key = name.toLowerCase().trim();
  if (SUBJECT_GRADIENTS[key]) return SUBJECT_GRADIENTS[key];
  const hash = key.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
  const pool = [
    'from-orange-400 to-red-500','from-lime-400 to-green-500',
    'from-indigo-400 to-purple-500','from-fuchsia-400 to-pink-500',
    'from-cyan-400 to-blue-500','from-yellow-400 to-orange-500'
  ];
  return pool[hash % pool.length];
}

function getSubjectIcon(name) {
  const key = name.toLowerCase().trim();
  return SUBJECT_ICONS[key] || 'fa-book';
}

function getGroupGradient(name) {
  const key = name.toLowerCase().trim();
  return GROUP_GRADIENTS[key] || 'from-gray-500 to-gray-700';
}

function getGroupDisplay(name) {
  const key = name.toLowerCase().trim();
  return GROUP_NAMES[key] || name.toUpperCase();
}

/* ---------- API ---------- */
async function api(action, params = {}, method = 'GET') {
  try {
    let url, options = {};
    if (method === 'GET') {
      url = new URL(API_BASE);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k, v]) => {
        if (v !== '' && v !== null && v !== undefined) url.searchParams.set(k, v);
      });
      options.method = 'GET';
    } else {
      url = API_BASE;
      options.method = 'POST';
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify({ action, ...params });
    }
    const res = await fetch(url.toString(), options);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'API Error');
    return data;
  } catch (e) {
    showToast('ত্রুটি: ' + e.message, 'error');
    throw e;
  }
}

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
  initGoogleSignIn();
  switchTab('home');
  loadData();
});

async function loadData() {
  try {
    const [subjects, groups, presets] = await Promise.all([
      api('subjectStats', {}),
      api('groupStats', {}),
      api('presets', {})
    ]);
    subjectsData = subjects.subjects || [];
    groupsData = groups.groups || [];
    presetsData = presets.presets || [];
    if (currentTab === 'archive') renderArchive();
    if (currentTab === 'exam') renderExam();
    if (currentTab === 'home') renderHome();
  } catch (e) { console.error('loadData error:', e); }
}

/* ---------- TABS ---------- */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="flex justify-center py-20"><div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>';

  switch (tab) {
    case 'home': renderHome(); break;
    case 'archive': renderArchive(); break;
    case 'exam': renderExam(); break;
    case 'misc': renderMisc(); break;
    case 'profile': renderProfile(); break;
  }
  document.getElementById('main-content').scrollTop = 0;
}

/* ---------- HOME ---------- */
function renderHome() {
  const xp = user ? (Math.floor(Math.random()*500)+100) : 0;
  const totalQ = subjectsData.length > 0 ? subjectsData.reduce((a,b)=>a+b.count,0) : '...';
  const totalGroups = groupsData.length || '...';

  const html = `
    <div class="slide-up">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-gradient-to-br from-primary to-emerald-700 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-primary/30">
            <i class="fas fa-graduation-cap"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-800 dark:text-white leading-tight">MCQ Master</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400">ভর্তি পরীক্ষা প্রস্তুতি</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 px-3 py-1.5 rounded-full text-sm font-bold border border-orange-200 dark:border-orange-800">
            <span class="streak-flame">🔥</span>
            <span>${xp}</span>
          </div>
          <button onclick="switchTab('profile')" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden border-2 border-white dark:border-gray-600 shadow-sm">
            ${user && user.picture ? `<img src="${user.picture}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-500 dark:text-gray-400"><i class="fas fa-user"></i></div>`}
          </button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3 mb-6">
        ${quickActionCard('প্রশ্ন ব্যাংক', 'fa-book-open', 'bg-amber-100 text-amber-600', "switchTab('archive')")}
        ${quickActionCard('দ্রুত প্র্যাকটিস', 'fa-bolt', 'bg-yellow-100 text-yellow-600', "startQuickPractice()")}
        ${quickActionCard('মক পরীক্ষা', 'fa-clipboard-list', 'bg-rose-100 text-rose-600', "switchTab('exam')")}
        ${quickActionCard('রুটিন', 'fa-calendar-days', 'bg-blue-100 text-blue-600', "showToast('শীঘ্রই আসছে!', 'info')")}
        ${quickActionCard('ডাউটস', 'fa-comments', 'bg-purple-100 text-purple-600', "showToast('শীঘ্রই আসছে!', 'info')")}
        ${quickActionCard('প্রগ্রেস', 'fa-chart-line', 'bg-emerald-100 text-emerald-600', "showToast('শীঘ্রই আসছে!', 'info')")}
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
          <div class="text-2xl font-bold text-primary mb-1">${totalQ}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400">মোট প্রশ্ন</div>

          <div class="text-xs text-gray-500 dark:text-gray-400">প্রতিষ্ঠান</div>

        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-700">
          <h3 class="font-bold text-gray-800 dark:text-white">লিডারবোর্ড</h3>
          <button class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-xs">

        </div>
        ${leaderboardItem(1, 'Dianne Russell', 457, 315, true)}
        ${leaderboardItem(2, 'Camelia Rachel', 456, 318, false)}

      ${subjectsData.length > 0 ? `
        <div class="mb-4">
          <h3 class="font-bold text-gray-800 dark:text-white mb-3">জনপ্রিয় বিষয়</h3>

                <div class="text-2xl mb-2 opacity-80"><i class="fas ${getSubjectIcon(s.subject)}"></i></div>

                <div class="text-[10px] opacity-80">${s.count} প্রশ্ন</div>

  `;

}

}

/* ---------- ARCHIVE ---------- */
function renderArchive() {
  const html = `
    <div class="slide-up">
      <div class="relative mb-4">
        <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" placeholder="প্রশ্নব্যাংক খুঁজুন..." 
          class="w-full pl-10 pr-4 py-3 rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm outline-none focus:ring-2 focus:ring-primary/50 transition"
          oninput="filterArchive(this.value)">
      </div>

/* ---------- GOOGLE SIGN IN ---------- */
function initGoogleSignIn() {
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.length < 20) return;
  if (typeof google === 'undefined') return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleResponse,
    auto_select: false
  });
  const el = document.getElementById('g_id_signin');
  if (el) {
    el.innerHTML = '';
    google.accounts.id.renderButton(el, {
      theme: 'outline', size: 'large', width: 280, text: 'signin_with', locale: 'bn'
    });
  }
}

function handleGoogleResponse(response) {
  try {
    const payload = parseJwt(response.credential);
    const account = {
      email: payload.email,
      name: payload.name,
      picture: payload.picture,
      userId: null
    };
    apiPost('saveAccount', {
      email: payload.email,
      name: payload.name,
      examType: '', groupId: '', unit: '', category: '', year: ''
    }).then(res => {
      if (res.success) {
        account.userId = res.account.userId;
        account.groupId = res.account.groupId;
        account.unit = res.account.unit;
        account.category = res.account.category;
        account.year = res.account.year;
        user = account;
        localStorage.setItem('mcq_user', JSON.stringify(user));
        showToast('স্বাগতম, ' + account.name + '!', 'success');
        renderProfile();
      }
    }).catch(() => {
      user = account;
      localStorage.setItem('mcq_user', JSON.stringify(user));
      showToast('স্বাগতম, ' + account.name + '!', 'success');
      renderProfile();
    });
  } catch (e) {
    showToast('লগইন ব্যর্থ হয়েছে', 'error');
  }
}

function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(jsonPayload);
}

function googleLogout() {
  user = null;
  localStorage.removeItem('mcq_user');
  if (typeof google !== 'undefined') google.accounts.id.disableAutoSelect();
  showToast('লগআউট সম্পন্ন', 'info');
  renderProfile();
}

/* ---------- QUIZ ENGINE ---------- */
async function startSubjectQuiz(subject, count = 20) {
  await startQuiz({ subject }, count);
}

async function startGroupQuiz(group) {
  await startQuiz({ groupId: group }, 20);
}

async function startPresetQuiz(group, unit) {
  await startQuiz({ groupId: group, unit: unit }, 20);
}

async function startQuickPractice() {
  await startQuiz({}, 10);
}

async function startQuiz(filters, count) {
  try {
    showToast('প্রশ্ন লোড হচ্ছে...', 'info');
    const data = await api('random', { ...filters, count: count });
    quiz.questions = data.questions || [];
    if (quiz.questions.length === 0) {
      showToast('কোনো প্রশ্ন পাওয়া যায়নি', 'error');
      return;
    }
    quiz.index = 0;
    quiz.score = 0;
    quiz.answers = {};
    quiz.startTime = Date.now();
    document.getElementById('quiz-modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    startTimer();
    renderQuizQuestion();
  } catch (e) {}
}

function startTimer() {
  if (quiz.timer) clearInterval(quiz.timer);
  quiz.timer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - quiz.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('quiz-timer').textContent = `${m}:${s}`;
  }, 1000);
}

function renderQuizQuestion() {
  const q = quiz.questions[quiz.index];
  document.getElementById('q-current').textContent = quiz.index + 1;
  document.getElementById('q-total').textContent = quiz.questions.length;
  document.getElementById('q-text').textContent = q['Question'];
  document.getElementById('q-meta').textContent = [q['Group ID'], q['Year'], q['Unit'], q['Subject']].filter(Boolean).join(' • ');
  document.getElementById('btn-next-q').classList.add('hidden');

  const optsDiv = document.getElementById('q-options');
  optsDiv.innerHTML = '';
  ['A', 'B', 'C', 'D'].forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-card w-full text-left p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex items-center gap-3 hover:border-primary/50 transition';
    btn.innerHTML = `
      <div class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center font-bold text-sm text-gray-600 dark:text-gray-300 flex-shrink-0">${opt}</div>
      <span class="text-sm text-gray-700 dark:text-gray-200">${q['Option ' + opt]}</span>
    `;
    btn.onclick = () => selectAnswer(opt, btn);
    optsDiv.appendChild(btn);
  });
}

function selectAnswer(opt, btnEl) {
  const q = quiz.questions[quiz.index];
  const correct = q['Answer'] === opt;
  if (correct) quiz.score++;
  quiz.answers[quiz.index] = { selected: opt, correct: q['Answer'] };

  const buttons = document.getElementById('q-options').children;
  Array.from(buttons).forEach((b, i) => {
    b.disabled = true;
    const letter = ['A', 'B', 'C', 'D'][i];
    const circle = b.querySelector('div');
    if (letter === q['Answer']) {
      b.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/20');
      circle.classList.add('bg-green-500', 'text-white');
      circle.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
    } else if (letter === opt && !correct) {
      b.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/20');
      circle.classList.add('bg-red-500', 'text-white');
      circle.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
    }
  });

  document.getElementById('btn-next-q').classList.remove('hidden');
}

function nextQuestion() {
  quiz.index++;
  if (quiz.index >= quiz.questions.length) {
    finishQuiz();
  } else {
    renderQuizQuestion();
  }
}

function finishQuiz() {
  if (quiz.timer) clearInterval(quiz.timer);
  document.getElementById('quiz-modal').classList.add('hidden');
  document.body.style.overflow = '';

  const elapsed = Math.floor((Date.now() - quiz.startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  const pct = Math.round((quiz.score / quiz.questions.length) * 100);

  const html = `
    <div class="slide-up">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 text-center mb-4">
        <div class="w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl ${pct >= 60 ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}">
          <i class="fas ${pct >= 60 ? 'fa-trophy' : 'fa-medal'}"></i>
        </div>
        <h3 class="font-bold text-xl text-gray-800 dark:text-white mb-1">পরীক্ষা শেষ!</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${quiz.score} / ${quiz.questions.length} সঠিক (${pct}%)</p>
        <div class="flex justify-center gap-4 text-sm mb-4">
          <div class="bg-gray-50 dark:bg-gray-700 rounded-xl px-4 py-2">
            <div class="text-gray-400 text-xs">সময়</div>
            <div class="font-bold text-gray-700 dark:text-gray-200">${m}:${s}</div>
          </div>
          <div class="bg-gray-50 dark:bg-gray-700 rounded-xl px-4 py-2">
            <div class="text-gray-400 text-xs">নির্ভুলতা</div>
            <div class="font-bold text-gray-700 dark:text-gray-200">${pct}%</div>
          </div>
        </div>
        <button onclick="switchTab('home')" class="w-full py-3 bg-primary hover:bg-primaryDark text-white rounded-xl font-bold transition shadow-lg shadow-primary/30">
          হোমে ফিরে যান
        </button>
      </div>

      <h3 class="font-bold text-gray-800 dark:text-white mb-3">রিভিউ</h3>
      <div class="space-y-3">
        ${quiz.questions.map((q, i) => {
          const ans = quiz.answers[i];
          const isCorrect = ans && ans.selected === q['Answer'];
          return `
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border ${isCorrect ? 'border-green-200 dark:border-green-800' : 'border-red-200 dark:border-red-800'}">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xs px-2 py-0.5 rounded ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} font-bold">${isCorrect ? 'সঠিক' : 'ভুল'}</span>
                <span class="text-xs text-gray-400">${q['Subject']}</span>
              </div>
              <p class="text-sm font-medium text-gray-800 dark:text-gray-200 mb-2">${q['Question']}</p>
              <div class="text-xs space-y-1">
                <div class="flex items-center gap-2 ${ans?.selected === q['Answer'] ? 'text-green-600 font-medium' : ans ? 'text-red-500' : ''}">
                  <span>আপনার উত্তর: ${ans?.selected || '-'}</span>
                </div>
                <div class="text-green-600 font-medium">সঠিক উত্তর: ${q['Answer']}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  document.getElementById('main-content').innerHTML = html;
}

function closeQuiz() {
  if (quiz.timer) clearInterval(quiz.timer);
  document.getElementById('quiz-modal').classList.add('hidden');
  document.body.style.overflow = '';
}

/* ---------- UTILS ---------- */
function toggleDark() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  const toggle = document.getElementById('dark-toggle');
  if (toggle) toggle.style.transform = isDark ? 'translateX(20px)' : 'translateX(0)';
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const colors = {
    success: 'bg-green-500',
    error: 'bg-red-500',
    info: 'bg-gray-800 dark:bg-gray-700'
  };
  toast.className = `${colors[type] || colors.info} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium slide-up pointer-events-auto max-w-[90%]`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px)'; setTimeout(() => toast.remove(), 300); }, 3500);
}
</script>
</div>
